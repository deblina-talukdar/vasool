<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vasool 24-second animated explainer</title>
<style>
:root{--blue:#305eff;--blue2:#2950da;--navy:#132644;--navy2:#203553;--bg:#f0f4f6;--card:#fff;--line:#dfe5ec;--mut:#5d6f86;--green:#1faa59;--red:#e5484d;--amber:#f3c969}
*{box-sizing:border-box}
html,body{margin:0;background:#0d1522;font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--navy)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#fit{width:960px;height:540px;transform-origin:top center}
.stage{position:relative;width:960px;height:540px;overflow:hidden;border-radius:18px;background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.world{position:absolute;left:0;top:0;height:540px;width:10560px;transition:transform .95s cubic-bezier(.65,0,.25,1);will-change:transform}
.panel{position:absolute;top:0;width:960px;height:540px;overflow:hidden}
.panel:before{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#dfe8ff,transparent 68%)}
.panel:after{content:"";position:absolute;left:-100px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#e3f3ea,transparent 68%)}
.a{opacity:0}
.panel.active .a{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,.45s)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.panel.active .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,.6s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.cap{position:absolute;left:44px;top:84px;font-size:15px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
.cap b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;margin-right:8px;letter-spacing:0;font-size:14px}
.h{position:absolute;left:44px;top:114px;font-size:34px;font-weight:800;line-height:1.12;max-width:480px;color:var(--navy)}
.abs{position:absolute}
.card{background:var(--card);border-radius:16px;box-shadow:0 6px 22px rgba(19,38,68,.12);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#e8eeff;color:var(--blue2);font-weight:700;font-size:15px;border:1px solid #cdd9ff}
.chip.g{background:#e3f6ea;color:#17884a;border-color:#bfe8cf}
.chip.r{background:#fde8e8;color:#c2373b;border-color:#f6c4c6}
.chip.n{background:#fff;color:var(--navy2);border-color:var(--line)}
.top{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10;pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--navy)}
.brand i{width:30px;height:30px;border-radius:9px 9px 9px 2px;background:var(--blue);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;left:8px;top:10px;width:14px;height:3px;background:#fff;border-radius:2px;box-shadow:0 6px 0 #fff}
.top img{height:26px}
.bottom{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(transparent,rgba(240,244,246,.95) 40%)}
.dots{display:flex;gap:7px;align-items:center}
.dots span{width:9px;height:9px;border-radius:50%;background:#c9d3e0;transition:.3s}
.dots span.on{background:var(--blue);transform:scale(1.4)}.dots span.done{background:var(--green)}
.guard{font-size:11.5px;color:var(--mut)}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0;z-index:11}
.tbl{width:100%;border-collapse:collapse;font-size:16px}.tbl td,.tbl th{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tbl tr.hl td{background:#fff1f1}
.phone{width:250px;height:410px;background:#101c2e;border-radius:30px;padding:10px;box-shadow:0 14px 34px rgba(19,38,68,.3)}
.screen{width:100%;height:100%;background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.screen .bar{background:#075e54;color:#fff;font-size:13px;font-weight:600;padding:10px 12px}
.screen .body{flex:1;background:#ece5dd;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.b{padding:8px 10px;border-radius:9px;line-height:1.35;max-width:88%}
.b.o{background:#d9fdd3;align-self:flex-end}.b.i{background:#fff;align-self:flex-start}
.btn{display:inline-block;padding:9px 18px;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.btn.gh{background:#eef2f7;color:var(--navy)}
.tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center}
.big{font-size:40px;font-weight:800}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars div{flex:1;border-radius:7px 7px 0 0;background:#cfd9e8;transform-origin:bottom}
.panel.active .bars div{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
svg.person{display:block}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.swoosh{position:absolute;height:4px;background:linear-gradient(90deg,var(--blue),transparent);border-radius:4px}
.start{position:absolute;inset:0;z-index:20;background:rgba(13,21,34,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center}
.start.hide{display:none}.start button{font:inherit;font-size:17px;padding:13px 28px;border-radius:10px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.panelc{width:960px;max-width:100%;background:#111b2b;border:1px solid #2a3a52;border-radius:12px;padding:12px;font-size:12.5px;color:#cfd8dc;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}
.panelc label{display:grid;gap:4px}.panelc select,.panelc input[type=range]{width:100%;font:inherit;background:#1b2a40;color:#e9edef;border:1px solid #2a3a52}
.panelc button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--blue);background:#111b2b;color:#8fa8ff;cursor:pointer}
body.rec .panelc{display:none}
</style></head><body>
